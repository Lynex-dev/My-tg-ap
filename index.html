<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск людей</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;}
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;}
        .user-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 8px; background: var(--tg-theme-secondary-bg-color, #f9f9f9);}
        .user-card a { color: #007bff; text-decoration: none; font-weight: bold;}
    </style>
</head>
<body>
    <h2>Поиск людей</h2>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Введите имя или @юзернейм...">
        <button onclick="performSearch()">Найти</button>
    </div>
    <div id="results"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ВАЖНО: Сюда вставим ссылку на наш сервер после его создания (Шаг 3)
        const API_URL = "ВАША_ССЫЛКА_НА_RENDER";

        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            const resultsDiv = document.getElementById('results');

            if (!query) return;

            resultsDiv.innerHTML = '<p>Ищем...</p>';

            try {
                // Делаем реальный запрос к нашему Python-серверу
                const response = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                resultsDiv.innerHTML = '';

                if (data.length === 0) {
                    resultsDiv.innerHTML = '<p>Никого не нашли.</p>';
                    return;
                }

                data.forEach(user => {
                    const usernameText = user.username ? `<a href="https://t.me/${user.username}" target="_blank">@${user.username}</a>` : 'нет юзернейма';
                    resultsDiv.innerHTML += `
                        <div class="user-card">
                            <strong>${user.first_name}</strong><br>
                            ID: <code>${user.id}</code><br>
                            Юзернейм: ${usernameText}
                        </div>`;
                });

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = '<p>Ошибка сервера. Проверьте, запущен ли он.</p>';
            }
        }
    </script>
</body>
</html>
