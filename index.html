<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lynex Helper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }
        .header h2 { margin: 0 0 5px 0; font-size: 18px; }
        .balance { font-size: 16px; font-weight: bold; color: #e53935; }
        .timer { font-size: 12px; color: var(--hint-color); margin-top: 5px; }

        .tabs {
            display: flex;
            width: 100%;
            gap: 5px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1 0 20%;
            padding: 10px 5px;
            background: var(--secondary-bg);
            color: var(--text-color);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        .tab-content { width: 100%; display: none; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }

        .input-group { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--hint-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }
        button.action-btn {
            padding: 14px 20px;
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button.action-btn:disabled { background-color: var(--hint-color); opacity: 0.7; }

        .results { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 15px;}
        .card { background: var(--secondary-bg); padding: 15px; border-radius: 10px; border-left: 4px solid var(--button-color); }
        .card h3 { margin: 0 0 5px 0; font-size: 16px; }
        .card p { margin: 0; font-size: 14px; color: var(--hint-color); }

        .spin-container { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 10px;}
        .wheel-wrapper { position: relative; width: 250px; height: 250px; }
        .arrow {
            width: 0; height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e53935;
            position: absolute; top: -15px; left: 110px; z-index: 10;
        }
        .wheel {
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 5px solid var(--secondary-bg);
            position: relative;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            overflow: hidden;
        }
        .wheel-center {
            width: 60px; height: 60px;
            background: var(--bg-color);
            border: 4px solid var(--secondary-bg);
            border-radius: 50%;
            position: absolute;
            top: 95px; left: 95px;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; z-index: 5;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .sector {
            position: absolute;
            width: 50%; height: 50%;
            transform-origin: bottom right;
            left: 0; top: 0;
            border-left: 1px solid rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .sector-text {
            position: absolute;
            top: 20px; right: 20px;
            width: 80px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            color: #000;
            transform: rotate(45deg);
        }
        .s0 { background: #ff9999; transform: rotate(0deg); }
        .s1 { background: #99ccff; transform: rotate(60deg); }
        .s2 { background: #99ff99; transform: rotate(120deg); }
        .s3 { background: #ffff99; transform: rotate(180deg); }
        .s4 { background: #ffcc99; transform: rotate(240deg); }
        .s5 { background: #cc99ff; transform: rotate(300deg); }

        .spin-result { font-size: 18px; font-weight: bold; text-align: center; min-height: 30px; color: var(--button-color);}

        .promo-card {
            background: var(--secondary-bg);
            border: 2px dashed #4caf50;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #2e7d32;
            position: relative;
        }
        .empty-msg { text-align: center; color: var(--hint-color); margin-top: 20px; }
        .error { color: #e53935; text-align: center; margin-top: 10px; }

        /* Стили для магазина */
        .shop-item {
            background: var(--secondary-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .shop-item h3 { margin: 0 0 10px 0; font-size: 20px; }
        .shop-item p { margin: 0 0 20px 0; color: var(--hint-color); font-size: 14px; }
        .shop-item button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
        .shop-item button:active { opacity: 0.8; }
        .shop-note {
            font-size: 12px;
            color: var(--hint-color);
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Lynex Helper</h2>
        <div class="balance" id="queriesDisplay">Загрузка...</div>
        <div class="timer" id="timerDisplay"></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('search')">🔍 Поиск</button>
        <button class="tab-btn" onclick="switchTab('spin')">🎰 Спин</button>
        <button class="tab-btn" onclick="switchTab('promo')">📜 Коды</button>
        <button class="tab-btn" onclick="switchTab('shop')">⭐ Магазин</button>
    </div>

    <!-- ВКЛАДКА ПОИСКА -->
    <div id="searchTab" class="tab-content active">
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Что ищем? (например, матрица)">
            <button class="action-btn" id="searchBtn" onclick="performSearch()">Найти</button>
        </div>
        <div class="results" id="resultsContainer"></div>
    </div>

    <!-- ВКЛАДКА РУЛЕТКИ -->
    <div id="spinTab" class="tab-content">
        <div class="spin-container">
            <div class="wheel-wrapper">
                <div class="arrow"></div>
                <div class="wheel" id="wheel">
                    <div class="wheel-center">🎯</div>
                </div>
            </div>
            <button class="action-btn" id="spinBtn" onclick="spinWheel()" style="width: 100%;">Крутить (1 запрос)</button>
            <div class="spin-result" id="spinResult"></div>
        </div>
    </div>

    <!-- ВКЛАДКА ПРОМОКОДОВ -->
    <div id="promoTab" class="tab-content">
        <div id="promoList" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <!-- ВКЛАДКА МАГАЗИНА -->
    <div id="shopTab" class="tab-content">
        <div class="shop-item">
            <h3>Пополнить баланс</h3>
            <p>5 дополнительных запросов для поиска и рулетки</p>
            <button onclick="buyQueries()">⭐ Купить за 50 Stars</button>
        </div>
        <div class="shop-note">
            Оплата проходит через Telegram Stars. После успешной оплаты запросы будут зачислены автоматически.
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const MAX_QUERIES = 5;
        const RESET_TIME_MS = 24 * 60 * 60 * 1000;
        const PRIZES = [
            "Ничего :(",
            "+1 запрос",
            "Скидка 10%",
            "Ничего :(",
            "+1 запрос",
            "Промокод LYNEXX"
        ];

        let queriesLeft = 0;
        let nextResetTime = 0;
        let promocodes = [];

        const database = [
            { title: "Матрица", desc: "Фантастический боевик 1999 года." },
            { title: "Интерстеллар", desc: "Космическая одиссея." },
            { title: "GTA V", desc: "Легендарная игра." },
            { title: "iPhone 15", desc: "Смартфон от Apple." }
        ];

        function initApp() {
            const now = new Date().getTime();
            let savedQueries = localStorage.getItem('lynex_queries');
            let savedResetTime = localStorage.getItem('lynex_reset_time');

            if (!savedQueries || !savedResetTime || now >= parseInt(savedResetTime)) {
                queriesLeft = MAX_QUERIES;
                nextResetTime = now + RESET_TIME_MS;
                localStorage.setItem('lynex_queries', queriesLeft);
                localStorage.setItem('lynex_reset_time', nextResetTime);
            } else {
                queriesLeft = parseInt(savedQueries);
                nextResetTime = parseInt(savedResetTime);
            }

            let savedPromos = localStorage.getItem('lynex_promos');
            if (savedPromos) {
                promocodes = JSON.parse(savedPromos);
            }

            drawWheel();
            updateUI();
            renderPromocodes();
            setInterval(updateTimer, 1000);
        }

        function drawWheel() {
            const wheel = document.getElementById('wheel');
            const sliceAngle = 360 / PRIZES.length;
            wheel.querySelectorAll('.sector').forEach(e => e.remove());

            PRIZES.forEach((prize, index) => {
                const sector = document.createElement('div');
                sector.className = `sector s${index}`;
                const span = document.createElement('span');
                span.className = 'sector-text';
                span.style.transform = `rotate(${sliceAngle / 2}deg)`;
                span.innerText = prize;
                sector.appendChild(span);
                wheel.appendChild(sector);
            });
        }

        function updateUI() {
            document.getElementById('queriesDisplay').innerText = `Осталось запросов: ${queriesLeft}`;
            const searchBtn = document.getElementById('searchBtn');
            const spinBtn = document.getElementById('spinBtn');
            if (queriesLeft <= 0) {
                searchBtn.disabled = true;
                spinBtn.disabled = true;
                spinBtn.innerText = "Нет запросов";
            } else {
                searchBtn.disabled = false;
                spinBtn.disabled = false;
                spinBtn.innerText = "Крутить (1 запрос)";
            }
        }

        function useQuery() {
            if (queriesLeft > 0) {
                queriesLeft--;
                localStorage.setItem('lynex_queries', queriesLeft);
                updateUI();
                return true;
            }
            return false;
        }

        function updateTimer() {
            const diff = nextResetTime - new Date().getTime();
            if (diff <= 0) { initApp(); return; }
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            document.getElementById('timerDisplay').innerText = `Сброс через: ${hours}ч ${minutes}м ${seconds}с`;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
            if (tabName === 'promo') renderPromocodes();
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');
            if (!query) { container.innerHTML = '<div class="error">Введите запрос!</div>'; return; }
            if (!useQuery()) return;
            container.innerHTML = '<p style="text-align:center;">Ищем...</p>';
            setTimeout(() => {
                const results = database.filter(item => item.title.toLowerCase().includes(query));
                container.innerHTML = '';
                if (results.length === 0) {
                    container.innerHTML = '<div class="error">Ничего не найдено 🤷‍♂️</div>';
                } else {
                    results.forEach(item => {
                        container.innerHTML += `<div class="card"><h3>${item.title}</h3><p>${item.desc}</p></div>`;
                    });
                }
            }, 500);
        }

        let currentRotation = 0;
        function spinWheel() {
            if (!useQuery()) return;
            const resultText = document.getElementById('spinResult');
            const wheel = document.getElementById('wheel');
            resultText.innerText = "Крутим...";
            const winningIndex = Math.floor(Math.random() * PRIZES.length);
            const winningPrize = PRIZES[winningIndex];
            const segmentAngle = 360 / PRIZES.length;
            const stopAngle = (winningIndex * segmentAngle) + (segmentAngle / 2);
            const targetRotation = 360 - stopAngle;
            const baseRotation = currentRotation % 360;
            let diff = targetRotation - baseRotation;
            if (diff < 0) diff += 360;
            currentRotation += (360 * 5) + diff;
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            setTimeout(() => {
                resultText.innerText = `Вы выиграли: ${winningPrize}`;
                if (winningPrize === "+1 запрос") {
                    queriesLeft++;
                    localStorage.setItem('lynex_queries', queriesLeft);
                    updateUI();
                } else if (winningPrize.includes("Промокод") || winningPrize.includes("Скидка")) {
                    addPromocode(winningPrize);
                }
            }, 4100);
        }

        function addPromocode(prizeName) {
            const randomCode = "LYN-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.floor(Math.random() * 100);
            const newPromo = `${prizeName} (Код: ${randomCode})`;
            promocodes.push(newPromo);
            localStorage.setItem('lynex_promos', JSON.stringify(promocodes));
            renderPromocodes();
        }

        function renderPromocodes() {
            const list = document.getElementById('promoList');
            list.innerHTML = '';
            if (promocodes.length === 0) {
                list.innerHTML = '<div class="empty-msg">У вас пока нет промокодов. Покрутите рулетку!</div>';
                return;
            }
            [...promocodes].reverse().forEach(promo => {
                list.innerHTML += `<div class="promo-card">${promo}</div>`;
            });
        }

        // Логика покупки
        function buyQueries() {
            // ВАЖНО: Для реальной оплаты нужен сервер, который создаст ссылку на инвойс.
            // Примерная ссылка на инвойс для Telegram Stars выглядит так:
            // https://t.me/$<invoice_slug>
            // Мы используем заглушку, которая показывает, как это должно работать.

            const invoiceUrl = "https://t.me/$YOUR_INVOICE_LINK"; // Замените на реальную ссылку с сервера

            if (tg.openInvoice) {
                tg.openInvoice(invoiceUrl, (status) => {
                    if (status === 'paid') {
                        // Успешная оплата
                        queriesLeft += 5;
                        localStorage.setItem('lynex_queries', queriesLeft);
                        updateUI();
                        alert('Оплата прошла успешно! Вам зачислено 5 запросов.');
                    } else if (status === 'cancelled') {
                        alert('Оплата отменена.');
                    } else if (status === 'failed') {
                        alert('Ошибка при оплате. Попробуйте позже.');
                    }
                });
            } else {
                alert('Ваш клиент Telegram не поддерживает оплату через Mini App. Обновите приложение.');
            }
        }

        initApp();
    </script>
</body>
    </html>
