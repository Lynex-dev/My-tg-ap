<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lynex Helper</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Верхняя панель */
        .header {
            width: 100%;
            background: var(--secondary-bg);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }
        .header h2 { margin: 0 0 5px 0; font-size: 18px; }
        .balance { font-size: 16px; font-weight: bold; color: #e53935; }
        .timer { font-size: 12px; color: var(--hint-color); margin-top: 5px; }

        /* Вкладки */
        .tabs {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--secondary-bg);
            color: var(--text-color);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--button-color);
            color: var(--button-text);
        }

        /* Блок Поиска */
        .search-box {
            width: 100%;
            display: none; /* Скрыто по умолчанию */
            flex-direction: column;
            gap: 10px;
        }
        .search-box.active { display: flex; }
        
        .input-group { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--hint-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }
        button.action-btn {
            padding: 14px 20px;
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button.action-btn:disabled { background-color: var(--hint-color); opacity: 0.7; }

        .results { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 15px;}
        .card { background: var(--secondary-bg); padding: 15px; border-radius: 10px; border-left: 4px solid var(--button-color); }
        .card h3 { margin: 0 0 5px 0; font-size: 16px; }
        .card p { margin: 0; font-size: 14px; color: var(--hint-color); }

        /* Блок Рулетки */
        .spin-box {
            width: 100%;
            display: none; /* Скрыто по умолчанию */
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .spin-box.active { display: flex; }
        
        /* Визуал рулетки */
        .wheel-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                #ff9999 0deg 60deg, 
                #99ccff 60deg 120deg, 
                #99ff99 120deg 180deg, 
                #ffff99 180deg 240deg, 
                #ffcc99 240deg 300deg, 
                #cc99ff 300deg 360deg
            );
            border: 8px solid var(--secondary-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1); /* Плавная остановка */
            position: relative;
        }
        .wheel-center {
            width: 50px;
            height: 50px;
            background: var(--bg-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 2;
        }
        /* Стрелочка сверху */
        .arrow {
            width: 0; 
            height: 0; 
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #e53935;
            position: absolute;
            top: -15px;
            z-index: 10;
        }

        .spin-result { font-size: 20px; font-weight: bold; text-align: center; margin-top: 10px; min-height: 30px; color: var(--button-color);}
        .error { color: #e53935; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Верхняя панель (видна всегда) -->
    <div class="header">
        <h2>Lynex Helper</h2>
        <div class="balance" id="queriesDisplay">Загрузка...</div>
        <div class="timer" id="timerDisplay"></div>
    </div>

    <!-- Кнопки вкладок -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('search')">🔍 Поиск</button>
        <button class="tab-btn" onclick="switchTab('spin')">🎰 Рулетка</button>
    </div>

    <!-- ВКЛАДКА ПОИСКА -->
    <div id="searchTab" class="search-box active">
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Что ищем? (например, матрица)">
            <button class="action-btn" id="searchBtn" onclick="performSearch()">Найти</button>
        </div>
        <div class="results" id="resultsContainer"></div>
    </div>

    <!-- ВКЛАДКА РУЛЕТКИ -->
    <div id="spinTab" class="spin-box">
        <div class="wheel-container" id="wheel">
            <div class="arrow"></div>
            <div class="wheel-center">🎯</div>
        </div>
        <button class="action-btn" id="spinBtn" onclick="spinWheel()" style="width: 100%;">Крутить (1 запрос)</button>
        <div class="spin-result" id="spinResult"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- НАСТРОЙКИ ---
        const MAX_QUERIES = 5;
        const RESET_TIME_MS = 24 * 60 * 60 * 1000; // 24 часа в миллисекундах
        const PRIZES = [
            "Ничего :(", 
            "+1 запрос", 
            "Скидка 10%", 
            "Ничего :(", 
            "+1 запрос", 
            "Промокод LYNEXX"
        ];

        let queriesLeft = 0;
        let nextResetTime = 0;

        // --- БАЗА ДАННЫХ ДЛЯ ПОИСКА ---
        const database = [
            { title: "Матрица", desc: "Фантастический боевик 1999 года." },
            { title: "Интерстеллар", desc: "Космическая одиссея." },
            { title: "GTA V", desc: "Легендарная игра." },
            { title: "iPhone 15", desc: "Смартфон от Apple." }
        ];

        // --- ЛОГИКА ВРЕМЕНИ И БАЛАНСА ---
        function initApp() {
            const now = new Date().getTime();
            let savedQueries = localStorage.getItem('lynex_queries');
            let savedResetTime = localStorage.getItem('lynex_reset_time');

            // Если данных нет (первый вход) ИЛИ время сброса уже прошло
            if (!savedQueries || !savedResetTime || now >= parseInt(savedResetTime)) {
                queriesLeft = MAX_QUERIES;
                nextResetTime = now + RESET_TIME_MS;
                
                localStorage.setItem('lynex_queries', queriesLeft);
                localStorage.setItem('lynex_reset_time', nextResetTime);
            } else {
                queriesLeft = parseInt(savedQueries);
                nextResetTime = parseInt(savedResetTime);
            }
            
            updateUI();
            setInterval(updateTimer, 1000); // Запускаем таймер обновления каждую секунду
        }

        function updateUI() {
            document.getElementById('queriesDisplay').innerText = `Осталось запросов: ${queriesLeft}`;
            const searchBtn = document.getElementById('searchBtn');
            const spinBtn = document.getElementById('spinBtn');
            
            if (queriesLeft <= 0) {
                searchBtn.disabled = true;
                spinBtn.disabled = true;
                spinBtn.innerText = "Нет запросов";
            } else {
                searchBtn.disabled = false;
                spinBtn.disabled = false;
                spinBtn.innerText = "Крутить (1 запрос)";
            }
        }

        function useQuery() {
            if (queriesLeft > 0) {
                queriesLeft--;
                localStorage.setItem('lynex_queries', queriesLeft);
                updateUI();
                return true;
            }
            return false;
        }

        // Функция, которая каждую секунду обновляет таймер на экране
        function updateTimer() {
            const now = new Date().getTime();
            const diff = nextResetTime - now;

            if (diff <= 0) {
                // Время вышло! Перезагружаем логику
                initApp();
                return;
            }

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('timerDisplay').innerText = `Сброс через: ${hours}ч ${minutes}м ${seconds}с`;
        }

        // --- ЛОГИКА ВКЛАДОК ---
        function switchTab(tabName) {
            document.getElementById('searchTab').classList.remove('active');
            document.getElementById('spinTab').classList.remove('active');
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (tabName === 'search') {
                document.getElementById('searchTab').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
            } else {
                document.getElementById('spinTab').classList.add('active');
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
            }
        }

        // --- ЛОГИКА ПОИСКА ---
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultsContainer');

            if (!query) {
                container.innerHTML = '<div class="error">Введите запрос!</div>';
                return;
            }

            // Списываем запрос
            if (!useQuery()) return; 

            container.innerHTML = '<p style="text-align:center;">Ищем...</p>';

            setTimeout(() => {
                const results = database.filter(item => 
                    item.title.toLowerCase().includes(query) || 
                    item.desc.toLowerCase().includes(query)
                );

                container.innerHTML = '';

                if (results.length === 0) {
                    container.innerHTML = '<div class="error">Ничего не найдено 🤷‍♂️</div>';
                } else {
                    results.forEach(item => {
                        container.innerHTML += `
                            <div class="card">
                                <h3>${item.title}</h3>
                                <p>${item.desc}</p>
                            </div>
                        `;
                    });
                }
                document.getElementById('searchInput').value = '';
            }, 500);
        }

        // --- ЛОГИКА РУЛЕТКИ ---
        let currentRotation = 0;

        function spinWheel() {
            if (!useQuery()) return; // Списываем запрос (если есть)

            const wheel = document.getElementById('wheel');
            const resultText = document.getElementById('spinResult');
            
            resultText.innerText = "Крутим...";
            
            // Генерируем случайный угол (минимум 5 полных оборотов + случайный сектор)
            const randomDegree = Math.floor(Math.random() * 360);
            currentRotation += 1800 + randomDegree; // 1800 = 5 оборотов по 360 градусов
            
            // Запускаем анимацию через CSS
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Ждем 3 секунды (пока идет анимация), затем выдаем результат
            setTimeout(() => {
                // Выбираем случайный приз
                const randomPrizeIndex = Math.floor(Math.random() * PRIZES.length);
                const prize = PRIZES[randomPrizeIndex];

                resultText.innerText = `Вы выиграли: ${prize}`;

                // Если выиграли доп. запрос, возвращаем его
                if (prize === "+1 запрос") {
                    queriesLeft++;
                    localStorage.setItem('lynex_queries', queriesLeft);
                    updateUI();
                }
            }, 3100); // 3.1 сек (чуть больше анимации)
        }

        // Запуск
        initApp();
    </script>
</body>
</html>
